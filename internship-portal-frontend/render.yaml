# Render Blueprint - deploys the frontend as a Static Site.
# Docs: https://render.com/docs/static-sites
services:
  - type: web
    name: internship-portal-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: VITE_API_BASE_URL
        sync: false          # set to your Flask API URL in the Render dashboard
      - key: VITE_API_PREFIX
        value: /api
      - key: VITE_API_WITH_CREDENTIALS
        value: "true"
      - key: VITE_ENABLE_FALLBACK_DATA
        value: "true"
      - key: VITE_DEMO_MODE
        value: "false"
    routes:
      # SPA fallback so deep links like /profile or /applications work on refresh
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
